name: Release
on:
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4
        with:
          cache: false
      - name: Install dependencies
        run: npm ci
      - name: Create Release Pull Request or Publish to GitHub
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # ratchet:changesets/action@v2
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish: npm run release:publish
          title: 'Release: New version'
          commit: 'Release: New version'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
